# An in-memory database that disappears after the tests
spring.datasource.url=jdbc:h2:mem:docmind-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test-only secret. Real secrets never go in Git, and this one protects nothing
app.jwt.secret=test-only-secret-that-is-at-least-32-characters-long
app.jwt.expiry-minutes=5

# No API key and no cost: the fake AI answers
app.ai.provider=fake