spring.application.name=backend
spring.profiles.active=local

# Uploads: one file at most 5 MB (the request a bit more for the form overhead)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Where uploaded PDFs live on disk. Relative to where the backend starts (backend/uploads).
# The folder name "uploads/" is already in .gitignore.
app.storage.dir=uploads

# Never show stack traces to the client, not even in development
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false

spring.web.error.include-message=never